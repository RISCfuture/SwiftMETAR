# CI Matrix Policy
#
# Category A (tools-version 6.2 + macOS 26 min): macos-26 + Swift 6.2
# Category B (tools-version 6.2 + older macOS):  macos-15 + 6.2, macos-26 + 6.2
# Category C (tools-version 6.3):                macos-15 + 6.3, macos-26 + 6.3
# Linux:                                          ubuntu + Swift 6.3
#   (Package.swift excludes METARFormatting/DecodeMETAR/DecodeTAF on Linux — they format
#   Measurement values via APIs swift-corelibs-foundation doesn't implement; SwiftMETAR
#   core + DecodeWindsAloft + tests are unaffected and build/test on Linux normally)
#
# This package is Category C. BuildableMacro requires tools-version 6.3, so Swift
# 6.1 and 6.2 can no longer resolve it.
#
# When Swift 6.4 ships: add 6.4 legs alongside 6.3

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            swift: "6.3"
          - os: macos-26
            swift: "6.3"
          - os: ubuntu-latest
            swift: "6.3"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  documentation:
    name: Build Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3"
      - name: Build documentation
        run: |
          swift package \
           --allow-writing-to-directory "$RUNNER_TEMP/docs" \
           generate-documentation \
           --target SwiftMETAR --target METARFormatting \
           --output-path "$RUNNER_TEMP/docs" \
           --enable-experimental-combined-documentation \
           --warnings-as-errors
  lint:
    name: Run SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v6
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O .swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: swift format lint --strict -r .
