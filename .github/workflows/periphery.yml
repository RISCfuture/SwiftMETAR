name: Periphery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  periphery:
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Record Swift version
        id: swift
        run: echo "version=$(swift --version | head -n1 | sed 's/[^[:alnum:].]/-/g')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-periphery-macos-latest-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
      - name: Install Periphery
        run: brew install periphery-pro/tap/periphery-cli
      - name: Run Periphery
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
        run: periphery scan --strict
